apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: gazeboexpress-gateway
  namespace: gazeboexpress
spec:
  gatewayClassName: gke-l7-regional-external-managed
  listeners:
    - name: http
      port: 80
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: Same

    - name: https
      port: 443
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: gazeboexpress-tls
      allowedRoutes:
        namespaces:
          from: Same