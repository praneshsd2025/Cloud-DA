apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: gazeboexpress-route
  namespace: gazeboexpress
spec:
  parentRefs:
    - name: gazeboexpress-gateway
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api
      backendRefs:
        - name: backend
          port: 5000
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: frontend
          port: 80
