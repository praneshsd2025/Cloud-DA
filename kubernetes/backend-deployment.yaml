apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: gazeboexpress
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: praneshsd/gazeboexpress-backend:v11
          imagePullPolicy: Always
          ports:
            - containerPort: 5000
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"
          env:
            - name: AUTHGEAR_ENDPOINT
              value: "https://shuffle-ylty8u.authgear.cloud"
            - name: AUTHGEAR_CLIENT_ID
              value: "a1d93aeb78d9f533"
            - name: AUTHGEAR_REDIRECT_URI
              value: "https://35-207-230-72.nip.io/"
          envFrom:
            - secretRef:
                name: mongodb-secret
