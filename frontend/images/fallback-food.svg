<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF7ED"/>
      <stop offset="100%" stop-color="#FFEDD5"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5E1E"/>
      <stop offset="100%" stop-color="#EA580C"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bg)"/>
  <g transform="translate(200, 130)">
    <!-- Food Cloche Cover -->
    <path d="M -70 20 A 70 65 0 0 1 70 20 Z" fill="url(#accent)" opacity="0.95"/>
    <rect x="-80" y="22" width="160" height="8" rx="4" fill="url(#accent)"/>
    <!-- Handle -->
    <circle cx="0" cy="-50" r="10" fill="url(#accent)"/>
    <path d="M -3 -42 L -3 -35 L 3 -35 L 3 -42 Z" fill="url(#accent)"/>
    <!-- Serving Platter -->
    <path d="M -90 35 L 90 35 L 80 42 L -80 42 Z" fill="#FED7AA"/>
    <!-- Steam Lines -->
    <path d="M -30 -65 Q -25 -80 -30 -90" stroke="#FF5E1E" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.6"/>
    <path d="M 0 -68 Q 5 -85 0 -95" stroke="#FF5E1E" stroke-width="3.5" stroke-linecap="round" fill="none" opacity="0.8"/>
    <path d="M 30 -65 Q 35 -80 30 -90" stroke="#FF5E1E" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.6"/>
  </g>
  <text x="200" y="220" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#EA580C" letter-spacing="1">GAZEBOEXPRESS</text>
  <text x="200" y="242" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500" fill="#9A3412" opacity="0.8">Campus Food Hub</text>
</svg>

