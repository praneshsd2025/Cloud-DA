services:
  backend:
    build: ./backend
    env_file:
      - ./backend/.env
    expose:
      - "5000"
    environment:
      INSTANCE_ID: backend
    restart: unless-stopped

  nginx-single:
    image: nginx:alpine
    ports:
      - "8082:80"
    volumes:
      - ./nginx-single.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    restart: unless-stopped
    

